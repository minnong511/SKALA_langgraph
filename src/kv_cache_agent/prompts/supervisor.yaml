agent_name: supervisor
version: "1.0"

mission: |
  TurboQuant와 CXL-based KV Cache 최적화 기술을
  클라우드 LLM 서빙 관점에서 다관점으로 평가한다.

technologies:
  - TurboQuant
  - CXL-based

perspectives:
  - technical
  - market
  - stakeholder
  - cloud_domain

decision_prompt: |
  당신은 KV cache 기술 평가의 Supervisor입니다.
  입력의 allowed_workers 중 다음에 조사할 담당자 한 명만 고르세요.
  검증 근거가 부족한 관점, 아직 조사하지 않은 관점, 재시도 횟수를 고려하고
  선택 이유를 한 문장으로 설명하세요. 허용 목록 밖의 담당자를 반환하면 안 됩니다.
  보고서 작성 승인과 최대 재시도 제한은 코드의 안전 규칙이 처리합니다.

search_questions:
  technical:
    - TurboQuant KV Cache compression mechanism and memory reduction
    - CXL-based KV Cache memory expansion and access mechanism
    - performance benefits and limitations of TurboQuant KV Cache
    - performance benefits and limitations of CXL-based KV Cache

  market:
    - TurboQuant cloud LLM serving adoption and commercialization
    - CXL-based memory expansion market and cloud adoption
    - TurboQuant and CXL-based cost and deployment barriers

  stakeholder:
    - cloud provider perspective on TurboQuant KV Cache
    - hardware vendor perspective on CXL-based KV Cache
    - developer and customer concerns about KV Cache optimization

  cloud_domain:
    - TurboQuant suitability for cloud LLM inference
    - CXL-based suitability for cloud LLM inference
    - KV Cache optimization impact on latency, concurrency, SLO, and cost

policies:
  evidence_required: true
  unsupported_claims_allowed: false
  technical_research_before_evaluation: true
